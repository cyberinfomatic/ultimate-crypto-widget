name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        wordpress: ['locked']
        include:
          # The oldest WordPress the plugin says it supports.
          - php: '8.1'
            wordpress: '6.5.5'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ucw_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_TESTS_DB_NAME: ucw_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Use WordPress ${{ matrix.wordpress }}
        if: matrix.wordpress != 'locked'
        run: composer require --dev --no-interaction --no-progress -W "roots/wordpress-no-content:${{ matrix.wordpress }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The shortcode snapshots need the built React bundles.
      - name: Build
        run: npm run build

      - name: JavaScript tests
        run: npm run test:js

      - name: PHPUnit
        run: composer phpunit
