name: Build, Package, and Deploy on Release
on:
  release:
    types: [created]

jobs:
  build-package-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies
        run: composer install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check that every version matches the tag
        run: |
          RELEASE_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          HEADER_VERSION=$(grep -m1 -E '^ \* Version:' ultimate-crypto-widget.php | awk '{print $3}')
          STABLE_TAG=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}')
          for found in "package.json:$PACKAGE_VERSION" "plugin header:$HEADER_VERSION" "readme stable tag:$STABLE_TAG"; do
            if [ "${found##*:}" != "$RELEASE_VERSION" ]; then
              echo "Error: ${found%%:*} says ${found##*:} but the release tag says $RELEASE_VERSION"
              exit 1
            fi
          done

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build the scripts
        run: npm run build

      - name: Check the code
        run: |
          npm run typecheck
          npm run test:js
          composer phpcs

      # After the build: the template takes the scripts' strings from the built files.
      - name: Make the translation template
        run: composer make-pot

      # Builds the assets, stages a clean copy, verifies it and writes dist/ultimate-crypto-widget-<version>.zip
      - name: Build and verify the zip
        run: |
          composer build
          cp dist/ultimate-crypto-widget-*.zip dist/plugin-free.zip

      - name: Archive files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-crypto-widget-${{ github.ref_name }}
          path: |
            dist/ultimate-crypto-widget-*.zip

      - name: Upload Free version to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/plugin-free.zip
          asset_name: ultimate-crypto-widget-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      # WordPress.org. Trunk becomes exactly what is in the zip: a file removed from the
      # plugin is removed there too, so nothing from an older version keeps shipping.
      - name: Deploy to WordPress.org
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ultimate-crypto-widget
        run: |
          SVN_TAG=${GITHUB_REF#refs/tags/v}

          unzip -q dist/plugin-free.zip -d dist/plugin-free-extracted
          svn co -q "https://plugins.svn.wordpress.org/${SLUG}" svn

          if [ -d "svn/tags/${SVN_TAG}" ]; then
            echo "Error: tag ${SVN_TAG} already exists on WordPress.org"
            exit 1
          fi

          rsync -a --delete --exclude='.svn' "dist/plugin-free-extracted/${SLUG}/" svn/trunk/

          # The banner and icon shown on the plugin's page live outside trunk.
          mkdir -p svn/assets
          cp assets/images/banner-* assets/images/icon-* svn/assets/ 2>/dev/null || true

          cd svn
          svn add --force . > /dev/null
          # Anything rsync deleted is "missing" to SVN until it is told.
          svn status | grep '^!' | sed 's/^! *//' | while IFS= read -r missing; do svn rm -q "$missing@"; done
          svn cp -q trunk "tags/${SVN_TAG}"

          svn ci -m "Release ${SVN_TAG}" --no-auth-cache --non-interactive --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}"
