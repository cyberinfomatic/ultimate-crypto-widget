name: Build the zip on main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Builds the assets, stages a clean copy, verifies it and writes the zip.
      - name: Build and verify the zip
        run: composer build

      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-crypto-widget-${{ github.sha }}
          path: dist/ultimate-crypto-widget-*.zip
